name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  macos:
    name: Build and publish macOS app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          echo "tag=$tag pubspec=$version"
          test "$tag" = "$version"

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build release app
        run: flutter build macos --release

      - name: Ad-hoc sign and package
        run: |
          app="build/macos/Build/Products/Release/FairShare.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/FairShare-${GITHUB_REF_NAME}-macos.zip"
          shasum -a 256 "dist/FairShare-${GITHUB_REF_NAME}-macos.zip" > "dist/FairShare-${GITHUB_REF_NAME}-macos.zip.sha256"
          ls -la dist

      - name: Write release notes
        run: |
          cat > dist/notes.md <<'NOTES'
          ## FairShare for macOS

          Offline-first expense sharing for roommates, friends, couples and group trips. No account, no server, no telemetry.

          ### Install

          1. Download `FairShare-<version>-macos.zip` and unzip it.
          2. Move `FairShare.app` to Applications.
          3. The app is **ad-hoc signed, not notarized** (no paid Apple developer account is used). On first launch macOS will refuse to open it. Either right-click the app and choose **Open**, or run:

             ```bash
             xattr -d com.apple.quarantine /Applications/FairShare.app
             ```

          A SHA-256 checksum is attached next to the zip.

          ### Platforms

          macOS is built and tested in CI. iOS and Android are not verified for this release; see `docs/LIMITATIONS.md`.
          NOTES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "FairShare $GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            --generate-notes \
            dist/FairShare-${GITHUB_REF_NAME}-macos.zip \
            dist/FairShare-${GITHUB_REF_NAME}-macos.zip.sha256
