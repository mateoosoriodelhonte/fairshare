name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  analyze-and-test:
    name: Analyze & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Verify generated code is up to date
        run: |
          ./tool/codegen.sh
          git diff --exit-code -- lib

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run unit and widget tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration test on macOS desktop
        run: flutter test integration_test/app_test.dart -d macos --timeout 5m

      - name: Capture README screenshots
        run: |
          flutter test integration_test/screenshots_test.dart -d macos --timeout 5m
          mkdir -p screenshots
          dir=$(find "$HOME/Library/Containers" /tmp /var/folders -type d -name fairshare-screenshots 2>/dev/null | head -1)
          echo "screenshots in: $dir"
          cp "$dir"/*.png screenshots/
          ls -la screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error

      - name: Build release app
        run: flutter build macos --release

      - name: Package app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent FairShare.app FairShare-macos.zip
          ls -la FairShare-macos.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: FairShare-macos
          path: build/macos/Build/Products/Release/FairShare-macos.zip
          if-no-files-found: error
